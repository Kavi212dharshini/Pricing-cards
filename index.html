
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="pricing">
        <h1>Choose Your Plan</h1>
        <p class="subtitle">Simple pricing for everyone</p>

        <div class="toggle">
            <button id="monthly" class="active">Monthly</button>
            <button id="yearly">Yearly</button>
        </div>

        <div class="cards">

            <div class="card">
                <h2>Basic</h2>
                <h3 class="price" data-month="199" data-year="1990">₹199</h3>
                <p>per month</p>
                <ul>
                    <li>5 Projects</li>
                    <li>Basic Support</li>
                    <li>5 GB Storage</li>
                </ul>
                <button class="choose">Get Started</button>
            </div>

            <div class="card popular">
                <span class="badge">POPULAR</span>
                <h2>Pro</h2>
                <h3 class="price" data-month="499" data-year="4990">₹499</h3>
                <p>per month</p>
                <ul>
                    <li>20 Projects</li>
                    <li>Priority Support</li>
                    <li>50 GB Storage</li>
                </ul>
                <button class="choose">Get Started</button>
            </div>

            <div class="card">
                <h2>Premium</h2>
                <h3 class="price" data-month="999" data-year="9990">₹999</h3>
                <p>per month</p>
                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>Unlimited Storage</li>
                </ul>
                <button class="choose">Get Started</button>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
